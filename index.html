<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST Countries</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <header class="bosh">
      <nav class="navbar container">
        <a href="./index.html" class="navbar__logo">Where in the world?</a>

        <button class="navbar__theme" id="theme-btn" type="button">
          <img class="navbar__icon" src="./icon/Group%203%20(2).svg" alt="moon" />
          <span>Dark Mode</span>
        </button>
      </nav>
    </header>

    <main class="container">
      <section class="search">
        <div class="search__box">
          <img class="search__icon" src="./icon/icon-search-black.svg" alt="search" />
          <input class="search__input" type="text" placeholder="Search for a country..." />
        </div>

        <select class="search__select">
          <option value="" hidden>Filter by Region</option>
          <option value="africa">Africa</option>
          <option value="americas">America</option>
          <option value="asia">Asia</option>
          <option value="europe">Europe</option>
          <option value="oceania">Oceania</option>
        </select>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
